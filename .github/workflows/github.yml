  # This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow when a tag is pushed
  # Commonly used for release or deployment pipelines
  push:
    tags:
      - 'v*'   # e.g. v1.0.0, v2.1.3 biz版本
      - 'vts*'   # e.g. vts1.0.0  schdule版本
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-vts:
    if: startsWith(github.ref_name, 'vts')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build with Maven
        working-directory: backend/group
        run: mvn clean package -Denv=dev -DskipTests=true

      - name: Login Docker Registry
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin ${{ secrets.DOCKER_REGISTRY }}

      - name: Prepare Docker Artifact
        run: |
          cp backend/group/schedule/target/bigstock-schedule.jar backend/schedule/biz/docker/

      - name: Build Docker Image
        run: |
          IMAGE_TAG=${{ github.ref_name }}
          docker build \
            -t isaac0410/bstock-all-in-one:${IMAGE_TAG} \
            backend/group/schedule/docker

      - name: Push Docker Image
        run: |
          IMAGE_TAG=${{ github.ref_name }}
          docker push isaac0410/bstock-all-in-one:${IMAGE_TAG}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Zeabur CLI
        run: npm install @zeabur/cli

      - name: Login Zeabur
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
        run: |
          for i in {1..5}; do
            npx zeabur@latest auth login --token "$ZEABUR_TOKEN" --interactive=false && exit 0
            echo "Login failed, retrying..."
            sleep 10
          done
          exit 1

      - name: Update Zeabur Service Image
        run: |
          NEW_TAG="${{ github.ref_name }}"
          ENV_ID="${{ secrets.ZEABUR_ENV_ID }}"
          PROJECT_ID="${{ secrets.ZEABUR_BIZ_PROJECT_ID }}"
          SERVICE_ID="${{ secrets.ZEABUR_BIZ_SERVICE_ID }}"

          npx zeabur@latest context set project --id $PROJECT_ID -i=false
          npx zeabur@latest service update tag \
            --id $SERVICE_ID \
            --env-id $ENV_ID \
            --tag $NEW_TAG \
            -i=false
  # biz tag更板模式
  build-normal:
    if: startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'vts')
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
