# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow when a tag is pushed
  # Commonly used for release or deployment pipelines
  push:
    tags:
      - 'v*'   # e.g. v1.0.0, v2.1.3

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # ---------------------------------------
      # Setup Node (ensures npx exists)
      # ---------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------------------------------------
      # Install Zeabur CLI (local install)
      # ---------------------------------------
      - name: Install Zeabur CLI
        run: npm install @zeabur/cli

      # ---------------------------------------
      # Login to Zeabur
      # ---------------------------------------
      - name: Login to Zeabur
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
        run: |
          # Retry up to 3 times if the connection is refused
          for i in {1..3}; do
            npx zeabur@latest auth login --token "$ZEABUR_TOKEN" --interactive=false && break || \
            (echo "Login failed, retrying in 10s..." && sleep 10);
          done

      # ---------------------------------------
      # Update Image
      # ---------------------------------------
      - name: Update Service Image
        run: |
          IMAGE_TAG=${{ github.ref_name }}
          npx zeabur service update bigstock-biz \
            --image isaac0410/bstock-all-in-one:${IMAGE_TAG}

      # ---------------------------------------
      # Redeploy Service
      # ---------------------------------------
      - name: Redeploy Service
        run: npx zeabur service redeploy bigstock-biz        