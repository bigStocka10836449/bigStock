        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin ${{ secrets.DOCKER_REGISTRY }} 
      - name: Prepare Docker build artifacts
        run: |
          cp backend/group/biz/target/bigstock-biz.jar backend/group/biz/docker/      
      - name: Build Docker image
        run: |
          IMAGE_TAG=${{ github.ref_name }}
          docker build \
            -t isaac0410/bstock-all-in-one:${IMAGE_TAG} \
            backend/group/biz/docker
      - name: Push Docker image
        run: |
          IMAGE_TAG=${{ github.ref_name }}
          docker push isaac0410/bstock-all-in-one:${IMAGE_TAG} 
      # ---------------------------------------
      # Setup Node (ensures npx exists)
      # ---------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------------------------------------
      # Install Zeabur CLI (local install)
      # ---------------------------------------
      - name: Install Zeabur CLI
        run: npm install @zeabur/cli

      # ---------------------------------------
      # Login to Zeabur
      # ---------------------------------------
      - name: Login to Zeabur
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
        run: |
            npx zeabur@latest auth login --token "$ZEABUR_TOKEN" --interactive=false && break || \
            (echo "Login failed, retrying in 10s..." && sleep 10);


      # ---------------------------------------
      # Update Image
      # ---------------------------------------
      - name: Update Service Image
        run: |
          # The name of your service in Zeabur
          SERVICE_NAME="bigstock-biz"
          # Your Docker Hub repository
          REPO_NAME="${{ secrets.ZEABUR_BIZ_REPO_NAME }}"
          # The tag from your GitHub push (e.g., vtest0.0.2)
          NEW_TAG="${{ github.ref_name }}"
          ENV_ID="${{ secrets.ZEABUR_ENV_ID }}"
          PROJECT_ID="${{ secrets.ZEABUR_SCHEDULE_PROJECT_ID }}"
          SERVICE_ID="${{ secrets.ZEABUR_SCHEDULE_SERVICE_ID }}"
          echo "Updating $SERVICE_ID to use $REPO_NAME:$NEW_TAG from Docker Hub..."
          npx zeabur@latest context set project --id $PROJECT_ID -i=false

          
          npx zeabur@latest service update tag --id $SERVICE_ID --env-id $ENV_ID --tag $NEW_TAG -i=false

    
    
