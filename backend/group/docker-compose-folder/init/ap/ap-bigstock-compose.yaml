version: '3.7'
services:
  bigstock-biz:
    image: isaac0410/bstock-all-in-one:${BIGSTOCK_TAG}
    restart: always
    container_name: bigstock-biz
    ports:
      - "18080:18080" 
    depends_on:
      - redis  
    environment:
      SPRING_CONSUL_HOST: big_stock_consul
      SPRING_CONSUL_PORT: 8500  
      SPRING_DATASOURCE_URL: jdbc:postgresql://bstock-postgresql:5432/bstock
      SPRING_DATASOURCE_USERNAME: bstockuser
      SPRING_DATASOURCE_PASSWORD: postgresql     
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: rabbitmq 
      JAVA_COMMAND_STR: -Xlog:gc+heap=trace:file=/opt/bigstock/logs/Xlog.log:time,uptimemillis,tid  -XX:+UseG1GC -XX:+ExplicitGCInvokesConcurrent -Dcatalina.home=/opt/bigstock -Xms800M -Xmx800M -Xss1M  -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=256m  -XX:MaxGCPauseMillis=10 -XX:InitiatingHeapOccupancyPercent=60 -XX:+UnlockExperimentalVMOptions -XX:MaxTenuringThreshold=10 -XX:G1NewSizePercent=3
      JAR_NAME: bigstock-biz.jar  
      MANAGEMENT_TRACING_EXPORT_ENDPOINT: http://jaeger:14250
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 0.1
      SCHEDULE_BPYTHON_URL: http://bigstock-python:8000/captcha/
      TRACING_URL: http://jaeger:4317
    networks:
      - big_stock_network  
    deploy:
      resources:
        limits:
          memory: 1g

networks:
  big_stock_network:
    external: true                